<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">
    <h1 class="mb-4 text-center fw-bold text-primary">📋 Gestor de Tareas</h1>

    <!-- Formulario para agregar tarea -->
    <form th:action="@{/guardar}" method="post" class="mb-4 shadow-sm p-3 bg-white rounded">
        <div class="input-group">
            <input type="text" name="descripcion" class="form-control" placeholder="Escribe una nueva tarea..." required>
            <button class="btn btn-primary px-4" type="submit">Agregar Tarea</button>
        </div>
    </form>

    <!-- Botones de Filtro (CORREGIDOS CON DOS PUNTOS th:href) -->
    <div class="mb-3 btn-group w-100" role="group" aria-label="Filtro de Tareas">
        <a th:href="@{/}" 
           class="btn btn-outline-primary" 
           th:classappend="${filtroActual == null ? 'active' : ''}">Todas</a>
        
        <a th:href="@{/(filtro='pendientes')}" 
           class="btn btn-outline-warning" 
           th:classappend="${filtroActual == 'pendientes' ? 'active' : ''}">Pendientes</a>
        
        <a th:href="@{/(filtro='completadas')}" 
           class="btn btn-outline-success" 
           th:classappend="${filtroActual == 'completadas' ? 'active' : ''}">Completadas</a>
    </div>

    <!-- Tabla de tareas -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Descripción</th>
                        <th>Estado</th>
                        <th class="text-end pe-3">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tarea : ${tareas}">
                        <td class="ps-3" 
                            th:text="${tarea.descripcion}" 
                            th:classappend="${tarea.completada ? 'text-decoration-line-through text-muted' : 'fw-semibold'}">
                        </td>
                        <td>
                            <span th:if="${tarea.completada}" class="badge bg-success">Completada</span>
                            <span th:unless="${tarea.completada}" class="badge bg-warning text-dark">Pendiente</span>
                        </td>
                        <td class="text-end pe-3">
                            <a th:href="@{/completar/{id}(id=${tarea.id})}" 
                               class="btn btn-sm" 
                               th:classappend="${tarea.completada ? 'btn-secondary' : 'btn-success'}">
                               <span th:text="${tarea.completada ? 'Desmarcar' : 'Completar'}"></span>
                            </a>
                            <a th:href="@{/eliminar/{id}(id=${tarea.id})}" class="btn btn-sm btn-danger ms-1">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tareas)}">
                        <td colspan="3" class="text-center text-muted py-4">No hay tareas creadas para este filtro.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
